server:
  port: ${PORT:8080}

spring:
  application:
    name: ride-booking-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ridedb}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:ride}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:ride}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDISHOST:localhost}}
      port: ${SPRING_REDIS_PORT:${REDISPORT:6379}}
      username: ${SPRING_REDIS_USERNAME:${REDISUSER:}}
      password: ${SPRING_REDIS_PASSWORD:${REDISPASSWORD:}}

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
  pricing:
    base-fare: 45
    per-km: 14
    per-minute: 2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
